[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "youtube-chat-bot"
version = "1.1.0"
description = "Bot de chat ao vivo para YouTube com IA e integracao OBS (TV IEBT)"
requires-python = ">=3.11"
dependencies = [
    "playwright>=1.40",
    "pyyaml>=6.0",
    "aiohttp>=3.9",
    "python-dotenv>=1.0",
    "PySide6>=6.6",
    "qasync>=0.27",
    "obsws-python>=1.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[project.scripts]
youtube-chat-bot = "youtube_chat_bot.app:main"
youtube-chat-bot-login = "youtube_chat_bot.login:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]